%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 320 
Camera1.fy: 320
Camera1.cx: 320
Camera1.cy: 240

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480

Camera.newWidth: 600
Camera.newHeight: 350

# Tracking parameters 
Track.noise_input: 1
# Dataset

Env.Trajectory.radius: 5
Env.Map.env_width: 11
Env.Map.env_height: 8
Env.Map.env_length: 7

Env.ReadOpenStructure.bool: 1
Env.Public.envtraj_path: "../results/hospital/baseline/camera_poses.txt"
Env.Public.envpoint_path: "../results/hospital/baseline/point_landmarks.txt" #results/V103/3DMap_registered.txt"
Env.Public.envline_path: "../results/hospital/baseline/line_landmarks.txt"
Env.Public.associate_path: "../results/hospital/baseline/association.txt"
Env.Public.envtraj_num: 633
Env.Public.envpoint_num: 2560
Env.Public.envline_num: 102

# results_path 
Evaluation.result_path: "../results/tartanair_test/"

# Camera frames per second 
Camera.fps: 30